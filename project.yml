name: Zipline
options:
  bundleIdPrefix: com.amiraliyazdani
  deploymentTarget:
    iOS: "15.0"
packages:
  ZiplineCore:
    path: Packages/ZiplineCore
targets:
  Zipline:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Shared
      - path: Sources/ModernApp
    resources:
      - path: Resources/Modern.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amiraliyazdani.zipline
        PRODUCT_NAME: Zipline
        INFOPLIST_KEY_CFBundleDisplayName: Zipline
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - package: ZiplineCore
        product: ZiplineCore
  ZiplineClassic:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/Shared
      - path: Sources/LegacyApp
    resources:
      - path: Resources/Legacy.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amiraliyazdani.zipline.classic
        PRODUCT_NAME: Zipline Classic
        INFOPLIST_KEY_CFBundleDisplayName: Zipline Classic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    dependencies:
      - package: ZiplineCore
        product: ZiplineCore
schemes:
  Zipline:
    build:
      targets:
        Zipline: all
  ZiplineClassic:
    build:
      targets:
        ZiplineClassic: all