name: CI
on:
  push:
    branches: [main, fix/standalone-xcode-projects]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-hygiene:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify project separation and assets
        run: bash Scripts/verify-repository.sh
  core-tests:
    name: Puzzle engine tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Run package tests
        run: swift test --package-path Packages/ZiplineCore
  main-app:
    name: Zipline Main · iOS 17+
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build Zipline Main
        run: >-
          xcodebuild -project 'Zipline Main/Zipline Main.xcodeproj'
          -scheme 'Zipline Main'
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
  classic-app:
    name: Zipline Classic · iOS 15+
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build Zipline Classic
        run: >-
          xcodebuild -project 'Zipline Classic/Zipline Classic.xcodeproj'
          -scheme 'Zipline Classic'
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
